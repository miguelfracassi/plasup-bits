<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script src="/gate.js"></script><link rel="icon" type="image/png" href="/logo.png"><link rel="shortcut icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipe - PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"></head><body><main class="wrap"><div id="hd"></div><div class="stats" id="st"></div><div class="tabs" id="tabs"></div><div id="tb"></div></main><script src="common.js"></script><script>
var T=null,M=[],tab='itens';
(async()=>{if(await shell('equipe'))load()})();
async function load(){const r=await api('team');T=r.team;M=r.membros||[];P=T?(await api('team/itens')).map(p=>({...p,ro:p.user_id!==me.id})):[];draw()}
const criar=()=>modal('Criar conta paroquial',[['nome','Nome da equipe','text']],{nome:me.paroquia},async o=>{await api('team','POST',o);closeM();load()},{btn:'Criar conta paroquial'});
const entrar=()=>modal('Entrar em conta paroquial',[['codigo','Link ou código do convite','text']],{},async o=>{const m=o.codigo.match(/c=([a-z0-9]+)/i);await api('team/entrar','POST',{codigo:m?m[1]:o.codigo.trim()});closeM();load()},{btn:'Entrar na equipe'});
const ren=()=>modal('Renomear equipe',[['nome','Nome da equipe','text']],{nome:T.nome},async o=>{await api('team','PUT',o);closeM();load()});
const adm=async id=>{if(confirm('Tornar este membro administrador da equipe?')){await api('team/admin','POST',{id});load()}};
const rem=async id=>{const x=M.find(m=>m.id===id);if(confirm(`Remover ${x.nome} da equipe?`)){await api('team/remover','POST',{id});load()}};
const sai=async()=>{if(confirm('Sair da equipe? Você deixa de ver os itens da equipe, e a equipe deixa de ver os seus.')){await api('team/sair','POST',{});tab='itens';load()}};
const novolink=async()=>{if(confirm('Gerar um novo link? O link atual deixará de funcionar.')){await api('team/novolink','POST',{});load()}};
function draw(){const w=!!T;
$('hd').innerHTML=w?`<h2 class="hi">${esc(T.nome)}</h2><p class="mut">Conta paroquial - ${M.length} membro(s) - você é ${T.papel==='admin'?'administrador':'membro'}</p>`:'<h2 class="hi">Equipe</h2><p class="mut">Trabalhe junto com a sua paróquia: veja os itens de todos e acompanhe o ranking.</p>';
if(!w){$('st').innerHTML=$('tabs').innerHTML='';$('tb').innerHTML='<div class="two"><div class="card"><h3>Criar conta paroquial</h3><p>Crie a equipe da sua paróquia e convide os membros por link. Você será o administrador.</p><div class="acts" style="margin-top:14px"><button class="btn pri" onclick="criar()">Criar conta paroquial</button></div></div><div class="card"><h3>Entrar em conta paroquial</h3><p>Já recebeu um convite? Cole o link ou o código para entrar na equipe.</p><div class="acts" style="margin-top:14px"><button class="btn" onclick="entrar()">Entrar em conta paroquial</button></div></div></div>';return}
stats(P);$('tabs').innerHTML=[['itens','Itens da equipe'],['rank','Ranking'],['mem','Membros'],['conv','Convidar membros para a equipe']].map(([k,l])=>`<button class="btn ${k===tab?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('');
({itens:lista,rank,mem,conv})[tab]()}
function lista(){if(!$('fm'))$('tb').innerHTML=`<div class="bar"><select id="fm" onchange="lst()"><option value="">Todos os membros</option>${M.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select><select id="fs" onchange="lst()"><option value="">Todos os status</option><option value="pendente">Pendente</option><option value="andamento">Em andamento</option><option value="concluido">Concluído</option><option value="atrasado">Atrasado</option></select><button class="btn pri" onclick="novo()">Novo item</button></div><div id="lt"></div>`;lst()}
function lst(){const m=$('fm').value,s=$('fs').value;$('lt').innerHTML=P.filter(p=>(!m||p.user_id==m)&&(!s||(s==='atrasado'?late(p):p.status===s))).map(card).join('')||'<p class="mut">Nenhum item da equipe por aqui.</p>'}
function rank(){const k=$('rk')?$('rk').value:'c30',L=[...M].sort((a,b)=>b[k]-a[k]||b.concluidos-a.concluidos),mx=Math.max(1,...L.map(x=>x[k]));
$('tb').innerHTML='<div class="bar"><select id="rk" onchange="rank()"><option value="c30">Últimos 30 dias</option><option value="concluidos">Todos os tempos</option></select></div>'+L.map((x,i)=>`<div class="card rk ${i<3&&x[k]?'top':''}"><span class="pos">${i+1}º</span><div class="rn"><b>${esc(x.nome)}</b>${x.id===me.id?' (você)':''}<div class="mut">${esc(x.cargo||'')}</div><div class="pb"><i style="width:${100*x[k]/mx}%"></i></div></div><div class="rs"><b>${x[k]}</b><span class="mut">concluídos</span></div><div class="rs"><b>${x.abertos}</b><span class="mut">em aberto</span></div><div class="rs"><b style="${x.atrasados?'color:#d32f2f':''}">${x.atrasados}</b><span class="mut">atrasados</span></div></div>`).join('');$('rk').value=k}
const PL={admin:'Coordenador',membro:'Membro',leitura:'Somente leitura'};
const pap=async(id,papel)=>{await api('team/papel','POST',{id,papel});load()};
const PERM=`<div class="card" style="margin-bottom:14px"><h3>Permissões</h3><p class="mut">O que cada papel pode fazer na equipe.</p><table class="tb"><tr><th></th><th>Coordenador</th><th>Membro</th><th>Somente leitura</th></tr>${[['Ver os itens, o histórico e as conversas',1,1,1],['Criar e editar os próprios itens',1,1,0],['Comentar nas conversas',1,1,0],['Convidar e remover membros',1,0,0],['Alterar papéis e renomear a equipe',1,0,0]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td class="${v?'sim':'nao'}">${v?'Sim':'Não'}</td>`).join('')}</tr>`).join('')}</table></div>`;
function mem(){const a=T.papel==='admin';$('tb').innerHTML=PERM+M.map(x=>`<div class="card it"><div><h3>${esc(x.nome)}${x.id===me.id?' (você)':''}</h3><div class="mut">${esc(x.cargo||'')}</div><span class="tg ${x.papel==='admin'?'v':''}">${PL[x.papel]||'Membro'}</span></div><div class="b2">${a&&x.id!==me.id?`<select onchange="pap(${x.id},this.value)" style="width:auto;margin:0">${Object.entries(PL).map(([k,l])=>`<option value="${k}" ${(x.papel||'membro')===k?'selected':''}>${l}</option>`).join('')}</select>`+`<button class="btn" onclick="rem(${x.id})">Remover da equipe</button>`:''}</div></div>`).join('')+`<div class="acts" style="margin-top:16px">${a?'<button class="btn" onclick="ren()">Renomear equipe</button>':''}<button class="btn" onclick="sai()">Sair da equipe</button></div>`}
function conv(){const lk=new URL('convite?c='+T.codigo,location.href).href;
$('tb').innerHTML=`<div class="card"><h3>Convidar membros para a equipe</h3><p>Envie este link para quem vai participar. A pessoa cria a conta (ou entra) e já fica na equipe.</p><div class="lk"><input id="lkv" readonly value="${lk}" onclick="this.select()"><button class="btn pri" onclick="navigator.clipboard.writeText($('lkv').value).then(()=>this.textContent='Link copiado')">Copiar link</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Entre na equipe '+T.nome+' no PasUp: '+lk)}">Enviar pelo WhatsApp</a></div>${T.papel==='admin'?'<div class="acts" style="margin-top:14px"><button class="btn" onclick="novolink()">Gerar novo link</button></div><p class="mut" style="margin-top:8px">Gerar um novo link desativa o anterior. Quem já está na equipe continua nela.</p>':''}</div>`}</script></body></html>
