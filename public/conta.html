<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script src="/gate.js"></script><link rel="icon" type="image/png" href="/logo.png"><link rel="shortcut icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta - PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"></head><body><main class="wrap"><h2 class="hi">Minha conta</h2><p class="mut">Gerencie seus dados, sua paróquia e sua senha.</p><div class="two" id="ct"></div></main><script src="common.js"></script><script>
const kv=(l,v)=>`<div class="kv"><span>${l}</span>${esc(v)}</div>`;
const edita=(t,ks)=>modal(t,CAD.filter(f=>ks.includes(f[0])),me,async o=>{me=(await api('me','PUT',{...me,...o})).user;closeM();render()});
function render(){$('ct').innerHTML=`<div class="card"><h3>Paróquia</h3>${kv('Paróquia',me.paroquia)}${kv('Diocese',me.diocese)}${kv('Cargo',me.cargo)}<button class="btn pri" onclick="edita('Mudar de paróquia',['paroquia','diocese','cargo'])">Mudar de paróquia</button></div>
<div class="card"><h3>Dados pessoais</h3>${kv('Nome completo',me.nome)}${kv('Telefone',me.telefone)}${kv('E-mail',me.email)}<button class="btn" onclick="edita('Editar dados pessoais',['nome','telefone'])">Editar dados</button></div>
<div class="card"><h3>Segurança</h3><p>Troque sua senha ou encerre a sessão neste aparelho.</p><div class="acts" style="margin-top:14px"><button class="btn" onclick="senha()">Alterar senha</button><button class="btn" onclick="sair()">Sair da conta</button></div></div>
<div class="card"><h3>Seus dados</h3><p>Baixe todos os seus planejamentos e postagens em uma planilha (CSV).</p><div class="acts" style="margin-top:14px"><button class="btn" onclick="exp()">Exportar meus itens</button></div></div>
<div class="card"><h3>Excluir conta</h3><p>Apaga sua conta e todos os seus dados, de forma definitiva.</p><div class="acts" style="margin-top:14px"><button class="btn" onclick="exc()">Excluir minha conta</button></div></div>`}
async function exp(){P=await api('plans');csv(P,'pasup-meus-itens')}
const exc=()=>modal('Excluir conta',[['senha','Digite sua senha para confirmar','password']],{},async o=>{await api('me/excluir','POST',o);localStorage.removeItem('tk');location.href=B},{btn:'Excluir definitivamente',extra:'<p class="mut" style="margin-top:10px">Seus planejamentos, postagens e PDFs serão apagados e não poderão ser recuperados.</p>'});
(async()=>{if(await shell('conta'))render()})();</script></body></html>
