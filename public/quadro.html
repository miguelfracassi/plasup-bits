<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script src="/gate.js"></script><link rel="icon" type="image/png" href="/logo.png"><link rel="shortcut icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quadro - PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"><style>.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}.kc{background:#ffffffb3;border:1px solid var(--ln);border-radius:16px;padding:12px;min-height:220px}.kc.ov2{outline:3px dashed var(--b)}.kc h3{font-size:1rem;margin-bottom:10px}.kk{background:#fff;border:1px solid var(--ln);border-left:5px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;cursor:grab;font-size:.9rem}.kk.alta{border-left-color:#d32f2f}.kk.media{border-left-color:#f2a100}.kk.baixa{border-left-color:var(--g)}.kk.late{background:#fff4f3}@media print{.hdr,.ft,#bg,.bar{display:none}}</style></head><body><main class="wrap"><h2 class="hi">Quadro</h2><p class="mut">Arraste os itens entre as colunas para mudar o status. Itens da equipe aparecem só na lista da equipe.</p><div class="bar"><select id="ft" onchange="draw()"><option value="">Planejamentos e postagens</option><option value="planejamento">Só planejamentos</option><option value="postagem">Só postagens</option></select><button class="btn pri" onclick="novo()">Novo item</button></div><div class="kb" id="kb"></div></main><script src="common.js"></script><script>
(async()=>{if(await shell('quadro'))load()})();
async function load(){P=await api('plans');draw()}
function draw(){const t=$('ft').value;$('kb').innerHTML=Object.entries(S).map(([k,l])=>{const L=P.filter(p=>p.status===k&&(!t||p.tipo===t));return `<div class="kc" data-s="${k}" ondragover="event.preventDefault();this.classList.add('ov2')" ondragleave="this.classList.remove('ov2')" ondrop="soltar(event,'${k}')"><h3>${l} (${L.length})</h3>${L.map(p=>`<div class="kk ${p.importancia} ${late(p)?'late':''}" draggable="true" ondragstart="event.dataTransfer.setData('text',${p.id})" onclick="edit(${p.id})"><b>${esc(p.titulo)}</b>${p.data_hora?`<div class="mut">${new Date(p.data_hora).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</div>`:''}${p.responsavel?`<div class="mut">${esc(p.responsavel)}</div>`:''}</div>`).join('')}</div>`}).join('')}
async function soltar(e,s){e.preventDefault();const id=+e.dataTransfer.getData('text'),p=P.find(x=>x.id===id);if(p&&p.status!==s){await api('plans/'+id,'PUT',{...p,status:s});}load()}
</script></body></html>
