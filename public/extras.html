<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script src="/gate.js"></script><link rel="icon" type="image/png" href="/logo.png"><link rel="shortcut icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferramentas - PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"><style>.ck2{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:.92rem}.ck2 input{width:auto;margin:4px 0 0}.ck2.f span{text-decoration:line-through;opacity:.55}.pre{white-space:pre-wrap;margin-top:8px;font-size:.92rem}.sg{border-style:dashed}</style></head><body><main class="wrap"><h2 class="hi" id="tt"></h2><p class="mut" id="sb"></p>
<div class="bar" style="margin-top:16px"><input id="q" placeholder="Buscar" oninput="draw()"><button class="btn pri" onclick="novo2()" id="nb"></button></div><div id="ls"></div><h2 class="s">Sugestões prontas</h2><div id="sg"></div></main><script src="common.js"></script><script>
const SV=[['equipe','Visível para a equipe'],['privado','Somente eu']];
const K={
ideia:{t:'Banco de ideias',d:'Guarde ideias de posts, vídeos e ações para não perdê-las. Mude o status conforme avança.',n:'Nova ideia',c:'Descrição da ideia',st:[['nova','Nova'],['aprovada','Aprovada'],['feita','Feita']],sg:[['Série "Você sabia?" sobre a história da paróquia','Posts curtos semanais com fotos antigas e curiosidades da comunidade.'],['Bastidores da equipe','Fotos e vídeos curtos de quem trabalha nos eventos (com autorização).'],['Mensagem da semana em vídeo de 30 segundos','Um trecho da palavra da semana, gravado na vertical.'],['Cartaz digital dos horários','Imagem fixa com horários de missa, confissão e atendimento.']]},
nota:{t:'Notas e atas',d:'Registre reuniões, decisões e combinados. A equipe pode consultar depois.',n:'Nova nota',c:'Conteúdo da nota ou ata',dt:'Data',sg:[['Modelo de ata de reunião','Data:\nPresentes:\nPauta:\n- \nDecisões:\n- \nTarefas e responsáveis:\n- \nPróxima reunião:']]},
contato:{t:'Contatos úteis',d:'Fotógrafos, gráficas, padres, coordenadores, grupos: tudo em um lugar só.',n:'Novo contato',ti:'Nome e função',c:'Telefone, e-mail, observações',copy:1,sg:[]},
checklist:{t:'Checklists',d:'Listas de verificação para não esquecer nada. Marque cada item ao concluir.',n:'Novo checklist',c:'Uma tarefa por linha',sg:[['Cobertura de evento','Combinar com a coordenação\nCarregar bateria e cartão de memória\nChegar 30 minutos antes\nFotos gerais, detalhes e pessoas\nPedir autorização de imagem\nSelecionar e editar as melhores\nPublicar no mesmo dia'],['Transmissão ao vivo','Testar internet\nTestar áudio\nEnquadrar câmera\nTítulo e descrição prontos\nAvisar nos grupos\nConferir bateria\nSalvar o vídeo depois'],['Antes de postar','Texto revisado\nImagem com boa qualidade\nData, hora e local conferidos\nPessoas marcadas corretamente\nHorário de publicação definido'],['Reunião da equipe','Definir pauta\nAvisar os membros\nReservar o local\nRegistrar a ata\nDistribuir as tarefas']]},
escala:{t:'Escala de cobertura',d:'Defina quem faz o quê em cada evento: foto, vídeo, transmissão, redes sociais.',n:'Nova escala',ti:'Evento',c:'Uma função por linha. Ex.: Fotos: Maria',dt:'Data e hora',sg:[['Escala padrão de missa','Fotos: \nVídeo: \nTransmissão: \nPostagem nas redes: ']]},
modelo:{t:'Modelos de texto',d:'Textos prontos para avisos, convites e legendas. Copie com um clique e veja a contagem de caracteres.',n:'Novo modelo',c:'Texto do modelo',copy:1,cnt:1,sg:[['Aviso de horário','Atenção, comunidade! Os horários desta semana são:\n\n[dia e hora]\n[dia e hora]\n\nContamos com a sua presença.'],['Convite para evento','Você é nosso convidado! [nome do evento]\n\nData: [data]\nHora: [hora]\nLocal: [local]\n\nVenha e traga a sua família.'],['Agradecimento','Obrigado a todos que participaram e ajudaram a realizar [evento]. Cada gesto fez a diferença!'],['Chamada de voluntários','Quer fazer parte da equipe? Estamos precisando de voluntários para [função]. Chame no privado ou fale com [nome].']]}};
const k=new URLSearchParams(location.search).get('k'),C=K[k]||K.ideia,KK=K[k]?k:'ideia';let L=[];
(async()=>{if(!await shell('ferramentas'))return;$('tt').textContent=C.t;document.title=C.t+' - PasUp';$('sb').textContent=C.d;$('nb').textContent=C.n;
$('sg').innerHTML=C.sg.length?C.sg.map((s,i)=>`<div class="card sg" style="margin-bottom:10px"><h3>${esc(s[0])}</h3><p class="mut pre">${esc(s[1])}</p><button class="btn" style="margin-top:10px" onclick="addS(${i})">Adicionar aos meus</button></div>`).join(''):'<p class="mut">Sem sugestões para esta ferramenta.</p>';load()})();
async function load(){L=await api('extras/'+KK);draw()}
const F=()=>[['titulo',C.ti||'Título','text'],['corpo',C.c,'textarea'],...(C.st?[['status','Status','select',C.st]]:[]),...(C.dt?[['data_hora',C.dt,'datetime-local']]:[]),['visib','Visibilidade','select',SV]];
function novo2(v={}){modal(C.n,F(),{visib:'equipe',status:C.st?C.st[0][0]:'',...v},async o=>{await api('extras','POST',{kind:KK,...o,data_hora:o.data_hora?new Date(o.data_hora).toISOString():null});closeM();load()})}
const addS=i=>novo2({titulo:C.sg[i][0],corpo:C.sg[i][1]});
const ed=id=>{const x=L.find(y=>y.id===id);modal('Editar',F(),{...x,data_hora:loc(x.data_hora)},async o=>{await api('extras/'+id,'PUT',{...o,data_hora:o.data_hora?new Date(o.data_hora).toISOString():null});closeM();load()})};
const rm=async id=>{if(confirm('Excluir este item?')){await api('extras/'+id,'DELETE');load()}};
const cp=id=>{const x=L.find(y=>y.id===id);navigator.clipboard.writeText(x.corpo||'').then(()=>alert('Copiado!'))};
async function mk(id,i){const x=L.find(y=>y.id===id),ls=(x.corpo||'').split('\n').map(l=>l.replace(/^\[x\] /,''));const was=(x.corpo||'').split('\n')[i].startsWith('[x] ');const a=(x.corpo||'').split('\n');a[i]=(was?'':'[x] ')+ls[i];x.corpo=a.join('\n');draw();await api('extras/'+id,'PUT',{...x,data_hora:x.data_hora})}
function body(x){if(KK==='checklist'){const a=(x.corpo||'').split('\n').filter((l,i)=>l.trim()),n=a.filter(l=>l.startsWith('[x] ')).length,all=(x.corpo||'').split('\n');return `<div class="pb"><i style="width:${a.length?100*n/a.length:0}%"></i></div><span class="mut">${n} de ${a.length} concluídos</span>`+all.map((l,i)=>l.trim()?`<label class="ck2 ${l.startsWith('[x] ')?'f':''}"><input type="checkbox" ${l.startsWith('[x] ')?'checked':''} ${x.user_id!==me.id?'disabled':''} onchange="mk(${x.id},${i})"><span>${esc(l.replace(/^\[x\] /,''))}</span></label>`:'').join('')}
return x.corpo?`<p class="pre mut">${esc(x.corpo)}</p>`:''}
function draw(){const q=$('q').value.toLowerCase();$('ls').innerHTML=L.filter(x=>((x.titulo||'')+(x.corpo||'')).toLowerCase().includes(q)).map(x=>`<div class="card it" style="margin-top:12px"><div style="flex:1;min-width:220px"><h3>${esc(x.titulo)}</h3>${x.dono&&x.user_id!==me.id?`<div class="mut">Por ${esc(x.dono)}</div>`:''}${x.status&&C.st?`<span class="tg">${esc((C.st.find(s=>s[0]===x.status)||[0,x.status])[1])}</span>`:''}${x.visib==='privado'?'<span class="tg">Privado</span>':''}${x.data_hora?`<span class="tg">${new Date(x.data_hora).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</span>`:''}${body(x)}${C.cnt?`<div class="mut" style="margin-top:6px">${(x.corpo||'').length} caracteres</div>`:''}</div><div class="b2">${C.copy?`<button class="btn" onclick="cp(${x.id})">Copiar</button>`:''}${x.user_id===me.id?`<button class="btn" onclick="ed(${x.id})">Editar</button><button class="btn" onclick="rm(${x.id})">Excluir</button>`:''}</div></div>`).join('')||'<p class="mut" style="margin-top:12px">Nada por aqui ainda. Use o botão acima ou as sugestões prontas.</p>'}
</script></body></html>
