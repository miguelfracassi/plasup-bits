<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script src="/gate.js"></script><link rel="icon" type="image/png" href="/logo.png"><link rel="shortcut icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite - PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"></head><body><main class="wrap"><div class="card" id="cv" style="max-width:520px;margin:40px auto"></div></main><script src="common.js"></script><script>
const C=new URLSearchParams(location.search).get('c')||'';
(async()=>{let t;
try{t=await api('team/convite/'+C)}catch(e){$('cv').innerHTML='<h3>Convite inválido</h3><p class="mut">Este link expirou ou não existe. Peça um novo link ao administrador da equipe.</p><div class="acts" style="margin-top:14px"><a class="btn" href="/">Ir para o início</a></div>';return}
if(!tk){localStorage.convite=C;$('cv').innerHTML=`<h3>Você foi convidado</h3><p>Entre na equipe <b>${esc(t.nome)}</b> no PasUp. Crie sua conta gratuita ou entre na sua conta para participar.</p><div class="acts" style="margin-top:14px"><a class="btn pri" href="/">Criar conta ou entrar</a></div>`;return}
if(!await shell('equipe'))return;
$('cv').innerHTML=`<h3>Convite para a equipe</h3><p>Você foi convidado para <b>${esc(t.nome)}</b>. Ao entrar, os membros verão os seus itens marcados como visíveis para a equipe.</p><p class="err" id="er2"></p><div class="acts" style="margin-top:14px"><button class="btn pri" onclick="ok()">Entrar na equipe</button><a class="btn" href="painel">Agora não</a></div>`})();
async function ok(){try{await api('team/entrar','POST',{codigo:C});localStorage.removeItem('convite');location.href='equipe'}catch(e){$('er2').textContent=e.message}}</script></body></html>
