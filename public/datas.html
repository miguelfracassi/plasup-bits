<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script src="/gate.js"></script><link rel="icon" type="image/png" href="/logo.png"><link rel="shortcut icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Datas importantes - PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"></head><body><main class="wrap"><h2 class="hi">Datas importantes</h2><p class="mut">Datas fixas do calendário. Festas móveis (Quaresma, Páscoa, Pentecostes) mudam a cada ano e você cadastra à mão. Confira sempre com a coordenação.</p><div id="ls" style="margin-top:16px"></div></main><script src="common.js"></script><script>
function load(){alert('Item criado! Veja em Postagens.')}
const D=[[1,1,'Santa Maria, Mãe de Deus e Dia Mundial da Paz'],[2,2,'Apresentação do Senhor'],[19,3,'São José'],[25,3,'Anunciação do Senhor'],[13,5,'Nossa Senhora de Fátima'],[24,6,'Natividade de São João Batista'],[29,6,'São Pedro e São Paulo'],[26,7,'São Joaquim e Sant\'Ana (Dia dos Avós)'],[4,8,'São João Maria Vianney (Dia do Padre)'],[15,8,'Assunção de Nossa Senhora'],[30,9,'São Jerônimo (Dia da Bíblia)'],[4,10,'São Francisco de Assis'],[12,10,'Nossa Senhora Aparecida'],[1,11,'Todos os Santos'],[2,11,'Finados'],[8,12,'Imaculada Conceição'],[25,12,'Natal do Senhor']];
(async()=>{if(!await shell('ferramentas'))return;const h=new Date();h.setHours(0,0,0,0);
const L=D.map(([d,m,t])=>{let x=new Date(h.getFullYear(),m-1,d,9);if(x<h)x=new Date(h.getFullYear()+1,m-1,d,9);return{x,t}}).sort((a,b)=>a.x-b.x);
$('ls').innerHTML=L.map((o,i)=>{const dias=Math.round((o.x-h)/864e5);return `<div class="card it" style="margin-bottom:10px"><div><h3>${esc(o.t)}</h3><span class="tg">${o.x.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}</span><span class="tg ${dias<=14?'r':''}">${dias===0?'Hoje':dias===1?'Falta 1 dia':'Faltam '+dias+' dias'}</span></div><div class="b2"><button class="btn" onclick="cria(${i})">Criar postagem</button></div></div>`}).join('');window.LL=L})();
const cria=i=>form({titulo:'Postagem: '+LL[i].t,tipo:'postagem',importancia:'media',status:'pendente',visib:'equipe',data_hora:LL[i].x.toISOString(),descricao:''});
</script></body></html>
