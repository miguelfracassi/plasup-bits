<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasUp Team</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css?v=5"><style>.tw{overflow-x:auto}.tb td,.tb th{text-align:left;white-space:nowrap}.tb th{cursor:pointer}.lg2{max-width:380px;margin:12vh auto}</style></head><body><div id="aur"></div><main class="wrap" id="app"></main><script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U=[],SK='created_at',SD=-1,PW=sessionStorage.getItem('pt')||'';
const A=$('app');
function login(msg){A.innerHTML=`<form class="card lg2" id="f"><img src="/logo.png" alt="PasUp" style="height:48px;display:block;margin:0 auto 10px"><h3 style="text-align:center">PasUp Team</h3><label>Senha<input id="pw" type="password" autocomplete="off" autofocus></label><p class="err">${esc(msg||'')}</p><div class="row"><button class="btn pri" style="width:100%">Entrar</button></div></form>`;$('f').onsubmit=e=>{e.preventDefault();PW=$('pw').value;carrega()}}
async function carrega(){try{const r=await fetch('/api/pasupteam',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:PW})}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.erro||'Erro');U=j.users;sessionStorage.setItem('pt',PW);tela()}catch(e){sessionStorage.removeItem('pt');PW='';login(e.message)}}
function tela(){const dist=k=>new Set(U.map(u=>(u[k]||'').trim().toLowerCase()).filter(Boolean)).size;
A.innerHTML=`<div class="top" style="margin:20px 0"><h2 class="hi" style="margin:0">PasUp Team</h2><div class="acts"><button class="btn" onclick="csv()">Exportar CSV</button><button class="btn" onclick="sessionStorage.removeItem('pt');PW='';login()">Sair</button></div></div>
<div class="stats">${[['Usuários',U.length],['Paróquias',dist('paroquia')],['Dioceses',dist('diocese')],['Em equipes',U.filter(u=>u.equipe).length]].map(([l,v])=>`<div class="card stat"><b>${v}</b><span class="mut">${l}</span></div>`).join('')}</div>
<div class="bar"><input id="q" placeholder="Buscar por nome, paróquia, diocese, e-mail ou telefone" oninput="lista()"></div><div class="card tw"><table class="tb" id="t"></table></div>`;lista()}
const C=[['nome','Nome'],['cargo','Cargo'],['paroquia','Paróquia'],['diocese','Diocese'],['telefone','Telefone'],['email','E-mail'],['equipe','Equipe'],['itens','Itens'],['created_at','Cadastro']];
function filtra(){const q=($('q')?.value||'').toLowerCase();return U.filter(u=>!q||C.some(([k])=>String(u[k]??'').toLowerCase().includes(q))).sort((a,b)=>{const x=a[SK]??'',y=b[SK]??'';return(typeof x==='number'?x-y:String(x).localeCompare(String(y)))*SD})}
function ord(k){SD=SK===k?-SD:1;SK=k;lista()}
function lista(){const L=filtra();$('t').innerHTML=`<tr>${C.map(([k,l])=>`<th onclick="ord('${k}')">${l}${SK===k?(SD>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`+L.map(u=>`<tr><td><b>${esc(u.nome)}</b></td><td>${esc(u.cargo)}</td><td>${esc(u.paroquia)}</td><td>${esc(u.diocese)}</td><td><a href="tel:${esc(u.telefone)}">${esc(u.telefone)}</a></td><td><a href="mailto:${esc(u.email)}">${esc(u.email)}</a></td><td>${esc(u.equipe||'')}</td><td>${u.concluidos}/${u.itens}</td><td>${new Date(u.created_at).toLocaleDateString('pt-BR')}</td></tr>`).join('')||'<tr><td colspan="9">Nenhum resultado.</td></tr>'}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const t=[C.map(c=>q(c[1])).join(';'),...filtra().map(u=>C.map(([k])=>q(k==='created_at'?new Date(u[k]).toLocaleDateString('pt-BR'):u[k])).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='pasup-usuarios.csv';a.click()}
PW?carrega():login();
</script></body></html>
