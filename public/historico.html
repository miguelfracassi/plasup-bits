<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><script src="/gate.js"></script><link rel="icon" type="image/png" href="/logo.png"><link rel="shortcut icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histórico - PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=5"></head><body><main class="wrap"><h2 class="hi">Histórico e auditoria</h2><p class="mut">Quem mudou o quê e quando, em ordem do mais recente para o mais antigo.</p><div class="bar" style="margin-top:14px"><select id="fa" onchange="draw()"><option value="">Todas as ações</option><option value="criou">Criou</option><option value="editou">Editou</option><option value="concluiu">Concluiu</option><option value="reabriu">Reabriu</option><option value="comentou">Comentou</option><option value="excluiu">Excluiu</option></select></div><div class="card"><div class="tl" id="tl"></div></div></main><script src="common.js"></script><script>
let H=[];const V={criou:'criou',editou:'editou',concluiu:'concluiu',reabriu:'reabriu',comentou:'comentou em',excluiu:'excluiu'};
(async()=>{if(!await shell('historico'))return;H=await api('historico');draw()})();
function draw(){const a=$('fa').value,L=H.filter(x=>!a||x.acao===a);let g='';
$('tl').innerHTML=L.map(x=>{const d=new Date(x.created_at),k=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}),h=k!==g?`<h3 style="margin:14px 0 8px;text-transform:capitalize">${k}</h3>`:'';g=k;return h+`<div class="ev"><b>${esc(x.nome.split(' ')[0])}</b> ${V[x.acao]||x.acao} <b>${esc(x.detalhe||'')}</b><div class="mut">${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div>`}).join('')||'<p class="mut">Nenhum registro ainda. As ações feitas a partir de agora aparecem aqui.</p>'}
</script></body></html>
