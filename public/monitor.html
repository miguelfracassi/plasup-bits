<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--b:#0a7be0;--g:#5cb946;--ink:#25303f;--mut:#6b7385;--ln:#e6ebf1;--grad:linear-gradient(110deg,#0a7be0,#1fa87c 62%,#5cb946);--sh:0 4px 18px -8px rgba(30,60,100,.18);--bl:#0a7be0;--gr:#1fa87c;--rd:#d32f2f;--am:#f2a100;--pu:#7c5cd6;--tx:#25303f;--mu:#6b7385;--c:#fff}
*{box-sizing:border-box;margin:0}html{font-size:clamp(11px,.85vw,22px);scrollbar-width:none;background:#f6f9fc}html::-webkit-scrollbar{display:none}
body{font-family:Poppins,system-ui,sans-serif;background:linear-gradient(180deg,#e9f3ff 0,#f6f9fc 420px,#f6faf6 100%) fixed;color:var(--ink);line-height:1.4;height:100vh;display:flex;flex-direction:column;padding:1.2vh 1.4vw;gap:1.2vh}
#hd{display:flex;align-items:center;gap:1.2rem;flex:none}#hd img{height:3.4rem;mix-blend-mode:multiply}#hd h1{font-size:1.7rem;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem 1rem;border-radius:99px;font-weight:600;font-size:.9rem;background:#e8f6ee;color:#15803d}.pill i{width:.65rem;height:.65rem;border-radius:50%;background:currentColor;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.25}}.pill.w{background:#fff4de;color:#b45309}.pill.x{background:#fde8e8;color:#c62828}
#ck{margin-left:auto;text-align:right;line-height:1.1}#ck b{font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums}#ck span{display:block;color:var(--mut);font-size:.78rem}
.ct{display:flex;gap:.5rem;align-items:center;opacity:.6;transition:.2s}.ct:hover{opacity:1}.ct button,.ct select{font:600 .8rem Poppins,sans-serif;background:#fff;color:var(--ink);border:1.5px solid var(--ln);border-radius:99px;padding:.4rem .9rem;cursor:pointer}.ct button:hover{border-color:var(--b);color:var(--b)}
#al .al{background:#fff4de;border:1px solid #f3d9a6;color:#8a4b08;border-radius:14px;padding:.5rem 1rem;font-size:.88rem;margin-bottom:.5vh}
#kp{display:grid;grid-template-columns:repeat(8,1fr);gap:1.2vh .9vw;flex:none}
.k,.p{background:#fff;border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh)}.k{padding:.8rem 1rem}.k b{display:block;font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}.k[style*="--rd"] b{background:none;color:var(--rd)}.k span{color:var(--ink);font-size:.88rem;font-weight:500}.k small{display:block;color:var(--mut);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gd{flex:1;min-height:560px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:1.2vh .9vw}
.p{padding:.85rem 1.1rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}.p h3{font-size:1rem;font-weight:600;display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.4rem;flex:none}.p h3 small{color:var(--mut);font-weight:400;font-size:.78rem}
.pb{flex:1;min-height:0;display:flex;flex-direction:column;gap:.3rem}.big{font-size:2rem;font-weight:700;line-height:1;flex:none}.sm{display:flex;gap:1rem;color:var(--mut);font-size:.78rem;flex:none}.sm b{color:var(--ink)}
.ch{flex:1;min-height:0}.ch svg{width:100%;height:100%;display:block}
.vb{flex:1;min-height:0;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--ln)}.vc{flex:1;height:100%;display:flex;align-items:flex-end}.vc i{width:100%;border-radius:4px 4px 0 0;background:var(--cl,var(--bl));min-height:2px}.bx{display:flex;justify-content:space-between;color:var(--mut);font-size:.7rem;flex:none}
.hb{flex:1;display:flex;flex-direction:column;justify-content:space-around;min-height:0}.hr{display:grid;grid-template-columns:34% 1fr 2.2rem;gap:.5rem;align-items:center;font-size:.82rem}.hr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr{height:.65rem;background:#eef2f6;border-radius:99px;overflow:hidden}.tr i{display:block;height:100%;border-radius:99px;background:var(--grad)}.hr b{text-align:right}
.dn{flex:1;min-height:0;display:flex;align-items:center;gap:1rem}.dn svg{height:100%;max-height:100%;aspect-ratio:1}.lg{display:flex;flex-direction:column;gap:.35rem;font-size:.84rem}.lg i{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.4rem}
table{width:100%;border-collapse:collapse;font-size:.84rem}td{padding:.3rem .2rem;border-bottom:1px solid #eef2f6}td:last-child{text-align:right;color:var(--mut)}tr:last-child td{border:0}
.dt{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.4rem;background:#5cb946}.dt.w{background:var(--am)}.dt.x{background:var(--rd)}
.fd{display:flex;flex-direction:column;overflow:hidden;font-size:.82rem}.fd div{display:flex;justify-content:space-between;gap:.5rem;padding:.3rem .2rem;border-bottom:1px solid #eef2f6;white-space:nowrap}.fd div span:first-child{overflow:hidden;text-overflow:ellipsis}.fd .nw{animation:nw 3s}@keyframes nw{from{background:#e8f6ee}}.ac{font-weight:600;color:var(--bl)}.ac.criou,.ac.concluiu{color:#15803d}.ac.excluiu{color:var(--rd)}.mu{color:var(--mut)}
.lg2{margin:auto;width:min(380px,90vw);background:#fff;border:1px solid var(--ln);border-radius:22px;box-shadow:var(--sh);padding:1.8rem;text-align:center;font-size:16px}.lg2 input{width:100%;margin:.6rem 0;padding:.7rem 1rem;border-radius:12px;border:1.5px solid var(--ln);font:inherit}.lg2 button{width:100%;padding:.7rem;border:0;border-radius:99px;background:var(--grad);color:#fff;font:inherit;font-weight:600;cursor:pointer}.err{color:var(--rd);min-height:1.4em;font-size:.9rem}
@media(max-width:1100px){#kp{grid-template-columns:repeat(4,1fr)}#gd{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:240px}}
</style></head><body><script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW=sessionStorage.getItem('pt')||'',IV=+localStorage.getItem('mon_iv')||5000,pause=false,timer=null,fails=0,seen=null,n=0,SAUDE=null;
const H={rtt:[],db:[],tot:[]},MAX=60,fmt=v=>(v??0).toLocaleString('pt-BR'),pad=v=>String(v).padStart(2,'0');
const ago=d=>{const s=Math.max(0,Math.round((Date.now()-new Date(d))/1000));return s<60?`${s}s`:s<3600?`${Math.floor(s/60)} min`:s<86400?`${Math.floor(s/3600)} h`:`${Math.floor(s/86400)} d`};
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function login(msg){clearTimeout(timer);document.body.innerHTML=`<form class="lg2" id="f"><img src="/logo.png" alt="PasUp" style="height:52px;mix-blend-mode:multiply"><h2 style="margin:.6rem 0">Monitor PasUp</h2><input id="pw" type="password" placeholder="Senha" autocomplete="off" autofocus><p class="err">${esc(msg||'')}</p><button>Entrar</button></form>`;$('f').onsubmit=e=>{e.preventDefault();PW=$('pw').value;sessionStorage.setItem('pt',PW);montar();tick()}}
function sair(){sessionStorage.removeItem('pt');PW='';H.rtt=[];H.db=[];H.tot=[];seen=null;login()}
function montar(){document.body.innerHTML=`<div id="hd"><img src="/logo.png" alt=""><h1>Monitor PasUp</h1><span id="st" class="pill"><i></i>Conectando…</span><div class="ct"><select id="iv">${[[3000,'3 s'],[5000,'5 s'],[10000,'10 s'],[30000,'30 s']].map(([v,l])=>`<option value="${v}" ${v===IV?'selected':''}>${l}</option>`).join('')}</select><button id="ps">Pausar</button><button id="fs">Tela cheia</button><button onclick="sair()">Sair</button></div><div id="ck"><b id="hr">--:--:--</b><span id="up"></span></div></div><div id="al"></div><div id="kp"></div><div id="gd"></div>`;
$('iv').onchange=e=>{IV=+e.target.value;localStorage.setItem('mon_iv',IV);agenda()};$('ps').onclick=()=>{pause=!pause;$('ps').textContent=pause?'Retomar':'Pausar';pause?clearTimeout(timer):tick()};$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
setInterval(()=>{const e=$('hr');if(e){const d=new Date();e.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(pad).join(':')}},1000);
async function ping(u){const t=performance.now();try{const r=await fetch(u+'?_='+Date.now(),{cache:'no-store'});let j=null;if((r.headers.get('content-type')||'').includes('json'))j=await r.json().catch(()=>null);else await r.blob();return{ok:r.ok&&(!j||j.ok!==false),ms:Math.round(performance.now()-t),erro:j&&j.erro}}catch(e){return{ok:false,ms:Math.round(performance.now()-t),erro:'sem resposta'}}}
function agenda(){clearTimeout(timer);if(!pause&&PW)timer=setTimeout(tick,IV)}
async function tick(){if(!PW||pause)return;clearTimeout(timer);const t=performance.now();
try{const[rs,ch]=await Promise.all([fetch('/api/monitor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:PW}),cache:'no-store'}),Promise.all([ping('/api/hora'),(n++%3===0||!SAUDE)?ping('/api/saude'):Promise.resolve(SAUDE),ping('/logo.png')])]);
const rtt=Math.round(performance.now()-t),j=await rs.json().catch(()=>({}));
if(rs.status===401||rs.status===429){sessionStorage.removeItem('pt');PW='';return login(j.erro)}
if(!rs.ok)throw Error(j.erro||'Erro '+rs.status);SAUDE=ch[1];fails=0;render(j,rtt,ch)}
catch(e){fails++;const s=$('st');if(s){s.className='pill x';s.innerHTML='<i></i>Sem resposta ('+fails+')'}if($('al'))$('al').innerHTML=`<div class="al">Falha ao consultar o servidor: ${esc(e.message)}. Tentando de novo…</div>`}
agenda()}
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(s.length*p))]||0},avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const P=(t,s,b)=>`<div class="p"><h3>${t}<small>${s||''}</small></h3><div class="pb">${b}</div></div>`;
function line(a,c,id){if(a.length<2)return'<div class="ch"></div>';const m=Math.max(...a,1)*1.2,pts=a.map((v,i)=>`${(i/(a.length-1)*200).toFixed(1)},${(58-v/m*54).toFixed(1)}`).join(' ');return`<div class="ch"><svg viewBox="0 0 200 60" preserveAspectRatio="none"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon points="0,60 ${pts} 200,60" fill="url(#g${id})"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>`}
const perf=(t,a,c,id,lim)=>{const l=a[a.length-1]??0;return P(t,'',`<div class="big" style="color:${l>lim?'var(--am)':c}">${l} ms</div>${line(a,c,id)}<div class="sm"><span>média <b>${avg(a)}</b></span><span>p95 <b>${q(a,.95)}</b></span><span>máx <b>${Math.max(0,...a)}</b></span></div>`)};
function vbars(a,c){const m=Math.max(...a.map(x=>x.n),1);return`<div class="vb" style="--cl:${c}">${a.map(x=>`<div class="vc" title="${esc(x.t)}: ${x.n}"><i style="height:${x.n/m*100}%"></i></div>`).join('')}</div><div class="bx"><span>${esc(a[0]?.t||'')}</span><span>pico ${m}</span><span>${esc(a.at(-1)?.t||'')}</span></div>`}
function hbars(a,c){const m=Math.max(...a.map(x=>x.n),1);return a.length?`<div class="hb" style="--cl:${c}">${a.map(x=>`<div class="hr"><span>${esc(x.nome||'—')}</span><div class="tr"><i style="width:${x.n/m*100}%"></i></div><b>${fmt(x.n)}</b></div>`).join('')}</div>`:'<p class="mu">Sem dados.</p>'}
function donut(seg,centro){const tot=seg.reduce((s,x)=>s+x[0],0)||1;let cum=0;return`<div class="dn"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#eef2f6" stroke-width="5"/>${seg.map(([v,c])=>{const p=v/tot*100,o=25-cum;cum+=p;return`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"/>`}).join('')}<text x="21" y="22.5" text-anchor="middle" fill="#25303f" font-size="6.5" font-weight="700">${fmt(centro)}</text></svg><div class="lg">${seg.map(([v,c,l])=>`<span><i style="background:${c}"></i>${l} <b>${fmt(v)}</b></span>`).join('')}</div></div>`}
function render(j,rtt,ch){const c=j.contagens||{},a=j.ativos||{},p=j.desempenho,s=j.servidor;
for(const[k,v]of[['rtt',rtt],['db',p.banco_ping_ms],['tot',p.total_ms]]){H[k].push(v);if(H[k].length>MAX)H[k].shift()}
const lento=rtt>1500||ch.some(x=>x.ms>2000),mal=!p.banco_ok||ch.some(x=>!x.ok),st=$('st');st.className='pill'+(mal?' x':(j.erros.length||lento)?' w':'');st.innerHTML='<i></i>'+(mal?'Problema detectado':(j.erros.length||lento)?'Atenção':'Tudo operando');
$('up').textContent='Atualiza a cada '+IV/1000+' s';
$('al').innerHTML=j.erros.map(e=>`<div class="al">Consulta <b>${esc(e.consulta)}</b> falhou: ${esc(e.erro)}</div>`).join('');
const K=(l,v,sub,col)=>`<div class="k" style="--a:${col}"><b>${fmt(v)}</b><span>${l}</span><small>${sub||'&nbsp;'}</small></div>`;
$('kp').innerHTML=K('Usuários',c.usuarios,`${fmt(c.equipes)} equipes`,'var(--bl)')+K('Ativos agora',a.a5,`${fmt(a.a15)} em 15 min`,'var(--gr)')+K('Ativos em 1 h',a.a60,`${fmt(a.a24)} em 24 h`,'var(--gr)')+K('Novos em 24 h',c.novos24,`${fmt(c.novos7)} em 7 d · ${fmt(c.novos30)} em 30 d`,'var(--pu)')+K('Itens',c.itens,`${fmt(c.pendentes)} pendentes`,'var(--bl)')+K('Atrasados',c.atrasados,'itens vencidos',c.atrasados?'var(--rd)':'var(--gr)')+K('Concluídos 24 h',c.concluidos24,`${fmt(c.itens24)} criados`,'var(--am)')+K('Comentários 24 h',c.comentarios24,`${fmt(c.comentarios)} no total`,'var(--pu)');
const nomes=[['API principal',ch[0]],['Banco de dados',ch[1]],['Arquivos do site',ch[2]],['Painel (API)',{ok:true,ms:rtt}]];
const cad=(j.cadastros||[]).map(x=>({n:x.n,t:x.dia.split('-').reverse().slice(0,2).join('/')})),hr=(j.porHora||[]).map(x=>({n:x.n,t:pad(new Date(x.h).getHours())+'h'}));
const ndp=Math.max(0,c.pendentes-c.atrasados),ids=(j.feed||[]).map(x=>x.id);
$('gd').innerHTML=perf('Resposta no navegador',H.rtt,'#0a7be0',1,1500)+perf('Latência do banco',H.db,'#1fa87c',2,800)+perf('Processamento do servidor',H.tot,'#7c5cd6',3,2000)
+P('Verificações','',`<table>${nomes.map(([nm,r])=>`<tr><td><span class="dt ${!r.ok?'x':r.ms>2000?'w':''}"></span>${nm}</td><td>${r.ok?(r.ms>2000?'Lento':'OK'):esc(r.erro||'Falhou')} · ${r.ms} ms</td></tr>`).join('')}</table>`)
+P('Cadastros','14 dias · '+fmt(cad.reduce((x,y)=>x+y.n,0)),vbars(cad,'var(--bl)'))
+P('Atividade','24 horas · '+fmt(c.acoes24)+' ações',vbars(hr,'var(--gr)'))
+P('Situação dos itens','',donut([[c.concluidos,'#1fa87c','Concluídos'],[ndp,'#0a7be0','No prazo'],[c.atrasados,'#d32f2f','Atrasados']],c.itens))
+P('Servidor e banco','',`<table><tr><td>Região</td><td>${esc(s.regiao||'—')}</td></tr><tr><td>Memória</td><td>${s.memoria_mb} MB</td></tr><tr><td>Instância ativa</td><td>${s.instancia_s<120?s.instancia_s+' s':Math.round(s.instancia_s/60)+' min'}${s.frio?' (a frio)':''}</td></tr><tr><td>Tamanho do banco</td><td>${j.banco?(j.banco.bytes/1048576).toFixed(1)+' MB':'—'}</td></tr><tr><td>Em equipe</td><td>${fmt(c.em_equipe)} usuários</td></tr>${j.vakinha?`<tr><td>Apoios Pix</td><td>${fmt(j.vakinha.pagos)} pagos · ${brl(j.vakinha.pago_cents)}</td></tr>`:''}</table>`)
+P('Ações em 24 h','por tipo',hbars((j.acoes||[]),'var(--gr)'))
+P('Top paróquias','usuários',hbars((j.paroquias||[]),'var(--bl)'))
+P('Itens por tipo','',hbars((j.tipos||[]),'var(--am)'))
+P('Atividade ao vivo','',`<div class="fd">${(j.feed||[]).slice(0,9).map(x=>`<div class="${seen!==null&&x.id>seen?'nw':''}"><span><b>${esc(x.nome)}</b> <span class="ac ${esc(x.acao)}">${esc(x.acao)}</span> ${esc(x.detalhe||'')}</span><span class="mu">${ago(x.created_at)}</span></div>`).join('')||'<p class="mu">Sem atividade.</p>'}</div>`);
seen=Math.max(0,...ids)}
/* rolagem lenta: se a tela não couber, desce devagar, espera e volta devagar */
(function(){let y=0,dir=1,wait=5,last=performance.now();const V=16;
function f(t){const dt=Math.min(.1,(t-last)/1000);last=t;const max=document.documentElement.scrollHeight-innerHeight;
if(max>4){if(Math.abs(scrollY-Math.round(y))>3)y=scrollY;if(wait>0)wait-=dt;else{y+=dir*V*dt;if(y>=max){y=max;dir=-1;wait=6}else if(y<=0){y=0;dir=1;wait=6}scrollTo(0,y)}}else y=0;requestAnimationFrame(f)}
requestAnimationFrame(f)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PW&&!pause)tick()});
if(PW){montar();tick()}else login();
</script></body></html>
