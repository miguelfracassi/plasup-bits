<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" href="/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor PasUp</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css?v=6"><style>
#app{display:block}.lg2{max-width:380px;margin:12vh auto}
.g{display:grid;gap:14px;margin:14px 0}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.k b{display:block;font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}.k span{font-size:.78rem}.k small{display:block;color:var(--mut);font-size:.74rem;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.85rem;background:#e8f6ee;color:#15803d}
.pill i{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.25}}
.pill.w{background:#fff4de;color:#b45309}.pill.x{background:#fde8e8;color:#c62828}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 4px}
.bar2 select{padding:7px 10px;border-radius:10px;border:1px solid #d9e2ec;font:inherit;font-size:.85rem;background:#fff}
.card h3{margin-bottom:8px}.sp{width:100%;height:46px;display:block}.sm{display:flex;gap:14px;font-size:.78rem;color:var(--mut);flex-wrap:wrap;margin-top:6px}.sm b{color:var(--ink)}
table.t2{width:100%;border-collapse:collapse;font-size:.86rem}.t2 td,.t2 th{padding:7px 6px;border-bottom:1px solid #eef2f6;text-align:left}.t2 th{color:var(--mut);font-weight:500;font-size:.76rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#16a34a}.dot.w{background:#f59e0b}.dot.x{background:#dc2626}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:8px}.bars i{flex:1;background:var(--grad);border-radius:3px 3px 0 0;min-height:2px}.bx2{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mut);margin-top:4px}
.fd{max-height:380px;overflow:auto}.fd div{padding:7px 4px;border-bottom:1px solid #eef2f6;font-size:.85rem;display:flex;gap:8px;justify-content:space-between}.fd div.nw{animation:fl3 2.5s}@keyframes fl3{from{background:#d9f3e0}}
.ac{font-weight:600}.ac.criou,.ac.concluiu{color:#15803d}.ac.excluiu{color:#c62828}.ac.comentou{color:#0a7be0}
.al{background:#fff4de;border:1px solid #f3d9a6;color:#8a4b08;border-radius:14px;padding:10px 14px;margin:10px 0;font-size:.86rem}
.on{display:flex;flex-wrap:wrap;gap:8px}.on span{background:#eef6ff;border-radius:999px;padding:5px 12px;font-size:.82rem}
</style></head><body><div id="aur"></div><main class="wrap" id="app"></main><script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=$('app');let PW=sessionStorage.getItem('pt')||'',IV=+localStorage.getItem('mon_iv')||5000,pause=false,timer=null,fails=0,seen=null,n=0,SAUDE=null;
const H={rtt:[],db:[],tot:[]},MAX=60,AC={criou:'criou',editou:'editou',concluiu:'concluiu',reabriu:'reabriu',excluiu:'excluiu',comentou:'comentou'};
const fmt=n=>(n??0).toLocaleString('pt-BR'),pad=n=>String(n).padStart(2,'0');
const ago=d=>{const s=Math.max(0,Math.round((Date.now()-new Date(d))/1000));return s<60?`há ${s}s`:s<3600?`há ${Math.floor(s/60)} min`:s<86400?`há ${Math.floor(s/3600)} h`:`há ${Math.floor(s/86400)} d`};
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function login(msg){clearTimeout(timer);A.innerHTML=`<form class="card lg2" id="f"><img src="/logo.png" alt="PasUp" style="height:48px;display:block;margin:0 auto 10px"><h3 style="text-align:center">Monitor PasUp</h3><label>Senha<input id="pw" type="password" autocomplete="off" autofocus></label><p class="err">${esc(msg||'')}</p><div class="row"><button class="btn pri" style="width:100%">Entrar</button></div></form>`;$('f').onsubmit=e=>{e.preventDefault();PW=$('pw').value;sessionStorage.setItem('pt',PW);montar();tick()}}
function sair(){sessionStorage.removeItem('pt');PW='';H.rtt=[];H.db=[];H.tot=[];seen=null;login()}
function montar(){A.innerHTML=`<div class="bar2"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2 class="hi" style="margin:0">Monitor PasUp</h2><span id="st" class="pill"><i></i>Conectando…</span></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mut" id="up" style="font-size:.8rem"></span><select id="iv" title="Intervalo de atualização">${[[3000,'3 s'],[5000,'5 s'],[10000,'10 s'],[30000,'30 s']].map(([v,l])=>`<option value="${v}" ${v===IV?'selected':''}>Atualiza a cada ${l}</option>`).join('')}</select><button class="btn" id="ps">Pausar</button><a class="btn" href="/pasupteam">Usuários</a><button class="btn" onclick="sair()">Sair</button></div></div><div id="al"></div><div id="b"><p class="mut">Carregando…</p></div>`;
$('iv').onchange=e=>{IV=+e.target.value;localStorage.setItem('mon_iv',IV);agenda()};$('ps').onclick=()=>{pause=!pause;$('ps').textContent=pause?'Retomar':'Pausar';if(!pause)tick();else clearTimeout(timer)}}
async function ping(u){const t=performance.now();try{const r=await fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});let j=null;if((r.headers.get('content-type')||'').includes('json'))j=await r.json().catch(()=>null);await (j?0:r.blob());return{ok:r.ok&&(!j||j.ok!==false),ms:Math.round(performance.now()-t),erro:j&&j.erro}}catch(e){return{ok:false,ms:Math.round(performance.now()-t),erro:'sem resposta'}}}
function agenda(){clearTimeout(timer);if(!pause&&PW)timer=setTimeout(tick,IV)}
async function tick(){if(!PW||pause)return;clearTimeout(timer);const t=performance.now();let j,rtt;
try{const[rs,ch]=await Promise.all([fetch('/api/monitor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:PW}),cache:'no-store'}),Promise.all([ping('/api/hora'),(n++%3===0||!SAUDE)?ping('/api/saude'):Promise.resolve(SAUDE),ping('/logo.png')])]);
rtt=Math.round(performance.now()-t);j=await rs.json().catch(()=>({}));
if(rs.status===401||rs.status===429){sessionStorage.removeItem('pt');PW='';return login(j.erro)}
if(!rs.ok)throw Error(j.erro||'Erro '+rs.status);SAUDE=ch[1];fails=0;render(j,rtt,ch)}
catch(e){fails++;const s=$('st');if(s){s.className='pill x';s.innerHTML='<i></i>Sem resposta ('+fails+')'}$('al')&&($('al').innerHTML=`<div class="al">Falha ao consultar o servidor: ${esc(e.message)}. Tentando de novo…</div>`)}
agenda()}
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(s.length*p))]||0},avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function spark(a,c){if(a.length<2)return'<svg class="sp"></svg>';const m=Math.max(...a,1),w=200,h=44,p=a.map((v,i)=>`${(i/(MAX-1)*w).toFixed(1)},${(h-3-v/m*(h-8)).toFixed(1)}`).join(' ');return`<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" points="${p}"/></svg>`}
function perf(t,a,c){const l=a[a.length-1]??0;return`<div class="card"><h3>${t}</h3><b style="font-size:1.5rem">${l} ms</b>${spark(a,c)}<div class="sm"><span>média <b>${avg(a)}</b></span><span>p95 <b>${q(a,.95)}</b></span><span>máx <b>${Math.max(0,...a)}</b></span></div></div>`}
function bars(a,lab){const m=Math.max(...a.map(x=>x.n),1);return`<div class="bars">${a.map(x=>`<i style="height:${Math.max(2,x.n/m*100)}%" title="${esc(x.t)}: ${x.n}"></i>`).join('')}</div><div class="bx2"><span>${esc(lab[0])}</span><span>${esc(lab[1])}</span></div>`}
function render(j,rtt,ch){const c=j.contagens||{},a=j.ativos||{},p=j.desempenho,s=j.servidor;
for(const[k,v]of[['rtt',rtt],['db',p.banco_ping_ms],['tot',p.total_ms]]){H[k].push(v);if(H[k].length>MAX)H[k].shift()}
const lento=rtt>1500||ch.some(x=>x.ms>2000),mal=!p.banco_ok||ch.some(x=>!x.ok),aviso=j.erros.length||lento;
const st=$('st');st.className='pill'+(mal?' x':aviso?' w':'');st.innerHTML='<i></i>'+(mal?'Problema detectado':aviso?'Atenção':'Tudo operando');
const d=new Date();$('up').textContent='Atualizado às '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(pad).join(':');
$('al').innerHTML=j.erros.map(e=>`<div class="al">Consulta <b>${esc(e.consulta)}</b> falhou: ${esc(e.erro)}</div>`).join('')+(lento&&!mal?'<div class="al">Respostas lentas no momento.</div>':'');
const K=(l,v,sub)=>`<div class="card k"><b>${fmt(v)}</b><span class="mut">${l}</span>${sub?`<small>${sub}</small>`:''}</div>`;
const nomes=[['API principal','/api/hora',ch[0]],['Banco de dados','/api/saude',ch[1]],['Arquivos do site','/logo.png',ch[2]],['Painel (API)','/api/monitor',{ok:true,ms:rtt}]];
const cad=(j.cadastros||[]).map(x=>({n:x.n,t:x.dia.split('-').reverse().slice(0,2).join('/')})),hr=(j.porHora||[]).map(x=>({n:x.n,t:pad(new Date(x.h).getHours())+'h'}));
const nova=seen===null?new Set():null,ids=(j.feed||[]).map(x=>x.id),mx=Math.max(0,...ids);
$('b').innerHTML=`<div class="g g6">${K('Usuários',c.usuarios,`+${fmt(c.novos24)} em 24 h · +${fmt(c.novos7)} em 7 d`)}${K('Ativos agora',a.a5,`${fmt(a.a15)} em 15 min · ${fmt(a.a60)} em 1 h`)}${K('Ativos em 24 h',a.a24,`${fmt(c.acoes24)} ações`)}${K('Itens',c.itens,`${fmt(c.pendentes)} pendentes · ${fmt(c.concluidos)} concluídos`)}${K('Atrasados',c.atrasados,`${fmt(c.itens24)} criados e ${fmt(c.concluidos24)} concluídos em 24 h`)}${K('Comentários',c.comentarios,`${fmt(c.comentarios24)} em 24 h`)}</div>
<h2 class="s">Desempenho</h2><div class="g g3">${perf('Resposta no seu navegador',H.rtt,'#0a7be0')}${perf('Latência do banco',H.db,'#1fa87c')}${perf('Processamento no servidor',H.tot,'#8b5cf6')}</div>
<div class="g g2"><div class="card"><h3>Verificações</h3><table class="t2"><tr><th>Serviço</th><th>Estado</th><th>Tempo</th></tr>${nomes.map(([n,u,r])=>`<tr><td>${n}<br><span class="mut" style="font-size:.72rem">${u}</span></td><td><span class="dot ${!r.ok?'x':r.ms>2000?'w':''}"></span>${r.ok?(r.ms>2000?'Lento':'OK'):esc(r.erro||'Falhou')}</td><td>${r.ms} ms</td></tr>`).join('')}</table></div>
<div class="card"><h3>Servidor e banco</h3><table class="t2"><tr><td>Região</td><td>${esc(s.regiao||'—')}</td></tr><tr><td>Node</td><td>${esc(s.node)}</td></tr><tr><td>Memória</td><td>${s.memoria_mb} MB (heap ${s.heap_mb} MB)</td></tr><tr><td>Instância ativa há</td><td>${s.instancia_s<120?s.instancia_s+' s':Math.round(s.instancia_s/60)+' min'}${s.frio?' (início a frio)':''}</td></tr><tr><td>Tamanho do banco</td><td>${j.banco?(j.banco.bytes/1048576).toFixed(1)+' MB':'—'}</td></tr><tr><td>Equipes</td><td>${fmt(c.equipes)} (${fmt(c.em_equipe)} usuários)</td></tr>${j.vakinha?`<tr><td>Apoios (Pix)</td><td>${fmt(j.vakinha.pagos)} pagos · ${fmt(j.vakinha.pendentes)} pendentes · ${brl(j.vakinha.pago_cents)}</td></tr>`:''}</table></div></div>
<div class="g g2"><div class="card"><h3>Cadastros nos últimos 14 dias</h3>${bars(cad,[cad[0]?.t||'',cad.at(-1)?.t||''])}</div><div class="card"><h3>Atividade nas últimas 24 horas</h3>${bars(hr,[hr[0]?.t||'',hr.at(-1)?.t||''])}</div></div>
<div class="g g2"><div class="card"><h3>Ativos nos últimos 30 min</h3>${(j.online||[]).length?`<div class="on">${j.online.map(u=>`<span title="${esc(u.paroquia||'')}">${esc(u.nome)} · ${ago(u.ultimo)}</span>`).join('')}</div>`:'<p class="mut">Ninguém com atividade registrada agora.</p>'}<h3 style="margin-top:18px">Últimos cadastros</h3><table class="t2">${(j.recentes||[]).map(u=>`<tr><td><b>${esc(u.nome)}</b><br><span class="mut" style="font-size:.74rem">${esc(u.cargo||'')} · ${esc(u.paroquia||'')}</span></td><td style="text-align:right;white-space:nowrap">${ago(u.created_at)}</td></tr>`).join('')}</table></div>
<div class="card"><h3>Atividade ao vivo</h3><div class="fd">${(j.feed||[]).map(x=>`<div class="${seen!==null&&x.id>seen?'nw':''}"><span><b>${esc(x.nome)}</b> <span class="ac ${AC[x.acao]||''}">${esc(AC[x.acao]||x.acao)}</span> ${esc(x.detalhe||'')}</span><span class="mut" style="white-space:nowrap">${ago(x.created_at)}</span></div>`).join('')||'<p class="mut">Sem atividade registrada.</p>'}</div></div></div>
<p class="mut" style="font-size:.76rem">“Ativos” = usuários com alguma ação registrada (criar, editar, concluir, comentar…). Apenas entrar ou navegar não conta.</p>`;
seen=mx}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PW&&!pause)tick()});
if(PW){montar();tick()}else login();
</script></body></html>
