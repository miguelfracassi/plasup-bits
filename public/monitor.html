.lo{margin:auto;width:min(380px,90vw);padding:1.8rem;text-align:center;font-size:16px}.lo input{width:100%;margin:.7rem 0;padding:.75rem;border-radius:.8rem;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:var(--tx);font:inherit}.lo button{width:100%;padding:.75rem;border:0;border-radius:99px;background:linear-gradient(90deg,var(--b),var(--a));color:#04121f;font:inherit;font-weight:700;cursor:pointer}.err{color:var(--r);min-height:1.4em;font-size:.9rem}
@media(max-width:1100px){#kp{grid-template-columns:repeat(3,1fr)}#mn{grid-template-columns:repeat(6,1fr);grid-template-rows:none;grid-auto-rows:300px}.s3{grid-column:span 3}.s6{grid-column:span 6}}
</style></head><body><div class="au"><i></i><i></i><i></i></div><script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW=sessionStorage.getItem('pt')||'',IV=+localStorage.getItem('mon_iv')||5000,pause=false,timer=null,fails=0,n=0,SAUDE=null,tkSig='';const prev={};
const H={rtt:[],db:[],tot:[]},MAX=60,fmt=v=>(v??0).toLocaleString('pt-BR'),pad=v=>String(v).padStart(2,'0');
const ago=d=>{const s=Math.max(0,Math.round((Date.now()-new Date(d))/1000));return s<60?`${s}s`:s<3600?`${Math.floor(s/60)} min`:s<86400?`${Math.floor(s/3600)} h`:`${Math.floor(s/86400)} d`};
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function login(msg){clearTimeout(timer);document.body.insertAdjacentHTML('beforeend','');document.querySelectorAll('body>*:not(.au):not(script)').forEach(e=>e.remove());document.body.insertAdjacentHTML('beforeend',`<form class="g lo" id="f"><img src="/logo.png" alt="PasUp" style="height:48px;background:#fff;border-radius:12px;padding:4px"><h2 style="margin:.6rem 0">Monitor PasUp</h2><input id="pw" type="password" placeholder="Senha" autocomplete="off" autofocus><p class="err">${esc(msg||'')}</p><button>Entrar</button></form>`);$('f').onsubmit=e=>{e.preventDefault();PW=$('pw').value;sessionStorage.setItem('pt',PW);montar();tick()}}
function sair(){sessionStorage.removeItem('pt');PW='';H.rtt=[];H.db=[];H.tot=[];login()}
const PN=(id,cl,t)=>`<div class="g p ${cl}"><h3>${t}<small id="${id}s"></small></h3><div class="pb" id="${id}"></div></div>`;
function montar(){document.querySelectorAll('body>*:not(.au):not(script)').forEach(e=>e.remove());document.body.insertAdjacentHTML('beforeend',`<div id="hd"><img src="/logo.png" alt=""><h1>Monitor PasUp</h1><span id="st" class="pill"><i></i>Conectando…</span><div class="ct"><select id="iv">${[[3000,'3 s'],[5000,'5 s'],[10000,'10 s'],[30000,'30 s']].map(([v,l])=>`<option value="${v}" ${v===IV?'selected':''}>${l}</option>`).join('')}</select><button id="ps">Pausar</button><button id="fs">Tela cheia</button><button onclick="sair()">Sair</button></div><div id="ck"><b id="hr">--:--:--</b><span id="up"></span></div></div><div id="al"></div><div id="kp"></div><div id="mn">${PN('hl','s3','Saúde do sistema')}${PN('gg','s6','Desempenho em tempo real')}<div class="g p s3"><h3>Ativos agora<small id="rds"></small></h3><div class="pb"><div class="rd"><i></i><i></i><i></i><div><b id="ra" data-k="a5">0</b><span>usuários com ação nos últimos 5 min</span></div></div><div class="on" id="on"></div></div></div>${PN('cd','s3','Cadastros')}${PN('at','s3','Atividade nas últimas 24 h')}${PN('dn','s3','Situação dos itens')}${PN('pr','s3','Top paróquias')}</div><div id="tk" class="g"><div id="tki"></div></div>`);
$('iv').onchange=e=>{IV=+e.target.value;localStorage.setItem('mon_iv',IV);agenda()};$('ps').onclick=()=>{pause=!pause;$('ps').textContent=pause?'Retomar':'Pausar';pause?clearTimeout(timer):tick()};$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
setInterval(()=>{const e=$('hr');if(e){const d=new Date();e.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(pad).join(':')}},1000);
async function ping(u){const t=performance.now();try{const r=await fetch(u+'?_='+Date.now(),{cache:'no-store'});let j=null;if((r.headers.get('content-type')||'').includes('json'))j=await r.json().catch(()=>null);else await r.blob();return{ok:r.ok&&(!j||j.ok!==false),ms:Math.round(performance.now()-t),erro:j&&j.erro}}catch(e){return{ok:false,ms:Math.round(performance.now()-t),erro:'sem resposta'}}}
function agenda(){clearTimeout(timer);if(!pause&&PW)timer=setTimeout(tick,IV)}
async function tick(){if(!PW||pause)return;clearTimeout(timer);const t=performance.now();
try{const[rs,ch]=await Promise.all([fetch('/api/monitor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:PW}),cache:'no-store'}),Promise.all([ping('/api/hora'),(n++%3===0||!SAUDE)?ping('/api/saude'):Promise.resolve(SAUDE),ping('/logo.png')])]);
const rtt=Math.round(performance.now()-t),j=await rs.json().catch(()=>({}));
if(rs.status===401||rs.status===429){sessionStorage.removeItem('pt');PW='';return login(j.erro)}
if(!rs.ok)throw Error(j.erro||'Erro '+rs.status);SAUDE=ch[1];fails=0;render(j,rtt,ch)}
catch(e){fails++;const s=$('st');if(s){s.className='pill x';s.innerHTML='<i></i>Sem resposta ('+fails+')'}if($('al'))$('al').innerHTML=`<div class="al">Falha ao consultar o servidor: ${esc(e.message)}. Tentando de novo…</div>`}
agenda()}
function anim(root){root.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k,to=+e.dataset.v,from=prev[k]??0;prev[k]=to;if(from===to){e.textContent=fmt(to);return}const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/800),v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));e.textContent=fmt(v);if(p<1)requestAnimationFrame(s)})(t0)})}
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(s.length*p))]||0},avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function sm(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d}
function area(a,c,id){if(a.length<2)return'<svg class="ar"></svg>';const m=Math.max(...a,1)*1.2,p=a.map((v,i)=>[i/(a.length-1)*200,56-v/m*50]),d=sm(p);return`<svg class="ar" viewBox="0 0 200 60" preserveAspectRatio="none"><defs><linearGradient id="a${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".5"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${d}L200,60L0,60Z" fill="url(#a${id})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2.4" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 5px ${c})"/></svg>`}
function gauge(v,max,lb,h,id){const f=Math.min(v/max,1)*100,c=f<40?'#34f5c5':f<75?'#ffc857':'#ff5d73',pa='M10 50A40 40 0 0 1 90 50';return`<div class="gc"><svg viewBox="0 0 100 58"><path d="${pa}" pathLength="100" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="9" stroke-linecap="round"/><path d="${pa}" pathLength="100" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.max(f,1.5)} 100" style="filter:drop-shadow(0 0 4px ${c})"/><text x="50" y="45" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">${v}</text><text x="50" y="55" text-anchor="middle" font-size="5.5" fill="#93a8c8">milissegundos</text></svg><div class="gl">${lb}</div>${area(h,c,id)}<div class="gs">média <b>${avg(h)}</b> · p95 <b>${q(h,.95)}</b> · máx <b>${Math.max(0,...h)}</b></div></div>`}
function vbars(a,c){const m=Math.max(...a.map(x=>x.n),1);return`<div class="vb" style="--cl:${c}">${a.map(x=>`<div class="vc" title="${esc(x.t)}: ${x.n}"><i style="height:${x.n/m*100}%"></i></div>`).join('')}</div><div class="bx"><span>${esc(a[0]?.t||'')}</span><span>pico ${m}</span><span>${esc(a.at(-1)?.t||'')}</span></div>`}
function hbars(a){const m=Math.max(...a.map(x=>x.n),1);return a.length?`<div class="hb">${a.map(x=>`<div class="hr"><span>${esc(x.nome||'—')}</span><div class="tr"><i style="width:${x.n/m*100}%"></i></div><b>${fmt(x.n)}</b></div>`).join('')}</div>`:'<p class="mu">Sem dados.</p>'}
function ring(sc,c,tx,sub){return`<svg viewBox="0 0 42 42"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#4da3ff"/></linearGradient></defs><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="3.4"/><circle cx="21" cy="21" r="15.9155" fill="none" stroke="url(#rg)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${sc} ${100-sc}" stroke-dashoffset="25" style="filter:drop-shadow(0 0 2px ${c})"/><text x="21" y="23.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff">${tx}</text><text x="21" y="29" text-anchor="middle" font-size="2.8" fill="#93a8c8">${sub}</text></svg>`}
function donut(seg,centro){const tot=seg.reduce((s,x)=>s+x[0],0)||1;let cum=0;return`<div class="dn"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4.5"/>${seg.map(([v,c])=>{const p=v/tot*100,o=25-cum;cum+=p;return`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${c}" stroke-width="4.5" stroke-dasharray="${Math.max(p-.6,0)} ${100-Math.max(p-.6,0)}" stroke-dashoffset="${o}" style="filter:drop-shadow(0 0 2px ${c})"/>`}).join('')}<text x="21" y="22.5" text-anchor="middle" fill="#fff" font-size="7" font-weight="800">${fmt(centro)}</text><text x="21" y="27" text-anchor="middle" fill="#93a8c8" font-size="2.6">itens</text></svg><div class="lg">${seg.map(([v,c,l])=>`<span><i style="background:${c};box-shadow:0 0 8px ${c}"></i>${l} <b>${fmt(v)}</b></span>`).join('')}</div></div>`}
function render(j,rtt,ch){const c=j.contagens||{},a=j.ativos||{},p=j.desempenho;
for(const[k,v]of[['rtt',rtt],['db',p.banco_ping_ms],['tot',p.total_ms]]){H[k].push(v);if(H[k].length>MAX)H[k].shift()}
const lento=rtt>1500||ch.some(x=>x.ms>2000),mal=!p.banco_ok||ch.some(x=>!x.ok),aviso=j.erros.length||lento;
let sc=100;if(!p.banco_ok)sc-=40;sc-=ch.filter(x=>!x.ok).length*20;if(rtt>1500)sc-=15;if(p.banco_ping_ms>800)sc-=10;sc-=j.erros.length*10;sc=Math.max(0,sc);
const st=$('st');st.className='pill'+(mal?' x':aviso?' w':'');st.innerHTML='<i></i>'+(mal?'Problema detectado':aviso?'Atenção':'Tudo operando');$('up').textContent='Atualiza a cada '+IV/1000+' s';
$('al').innerHTML=j.erros.map(e=>`<div class="al">Consulta <b>${esc(e.consulta)}</b> falhou: ${esc(e.erro)}</div>`).join('');
const K=(l,k,v,sub,col)=>`<div class="g k" style="--ac:${col}"><b data-k="${k}" data-v="${v||0}">0</b><span>${l}</span><small>${sub||'&nbsp;'}</small></div>`;
$('kp').innerHTML=K('Usuários','u',c.usuarios,`${fmt(c.equipes)} equipes`,'#4da3ff')+K('Novos em 24 h','n',c.novos24,`${fmt(c.novos7)} em 7 d · ${fmt(c.novos30)} em 30 d`,'#b388ff')+K('Itens','i',c.itens,`${fmt(c.pendentes)} pendentes`,'#4da3ff')+K('Atrasados','at',c.atrasados,'itens vencidos',c.atrasados?'#ff5d73':'#34f5c5')+K('Concluídos em 24 h','c',c.concluidos24,`${fmt(c.itens24)} criados`,'#ffc857')+K('Comentários em 24 h','co',c.comentarios24,`${fmt(c.comentarios)} no total`,'#b388ff');
const sc2=sc>=85?'#34f5c5':sc>=60?'#ffc857':'#ff5d73',nomes=[['API',ch[0]],['Banco',ch[1]],['Site',ch[2]],['Painel',{ok:true,ms:rtt}]];
$('hl').innerHTML=`<div class="hl">${ring(sc,sc2,sc,'de 100')}<div class="chk">${nomes.map(([nm,r])=>`<span><i class="dt ${!r.ok?'x':r.ms>2000?'w':''}"></i>${nm} ${r.ms} ms</span>`).join('')}</div></div>`;
$('hls').textContent=mal?'crítico':aviso?'atenção':'excelente';
$('gg').innerHTML=`<div class="gr">${gauge(rtt,2000,'Resposta no navegador',H.rtt,1)}${gauge(p.banco_ping_ms,1000,'Latência do banco',H.db,2)}${gauge(p.total_ms,3000,'Processamento do servidor',H.tot,3)}</div>`;
